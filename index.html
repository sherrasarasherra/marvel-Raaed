<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinical Rounds — RAAED Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F2E2B;
    --navy-deep: #0A211F;
    --paper: #F3F7F5;
    --surface: #FFFFFF;
    --ink: #16221F;
    --ink-muted: #5C7873;

    --teal: #5AA7A7;
    --mint: #96D7C6;
    --olive: #BAC94A;
    --gold: #E2D36B;
    --slate: #6C8CBF;

    --mint-tile: #B9E4D6;
    --gold-tile: #F0E39B;
    --coral-tile: #F3B6A6;
    --slate-tile: #AEC2E3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
  }

  .shell { max-width: 1080px; margin: 0 auto; padding: 20px 24px 80px; }

  /* ── Top bar ───────────────────────────── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 4px 28px;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--navy);
  }

  .brand span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-muted);
    display: block;
    margin-top: 2px;
    max-width: 380px;
    line-height: 1.3;
  }

  .top-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--surface);
    border: 1px solid #DCE7E2;
    padding: 8px 14px;
    border-radius: 999px;
    color: var(--teal);
  }

  /* ── Hero ──────────────────────────────── */
  .hero {
    background: linear-gradient(155deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-radius: 28px;
    padding: 42px 48px;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    align-items: center;
    gap: 24px;
  }

  .hero-copy h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(44px, 6vw, 68px);
    line-height: 0.98;
    color: #EAF4EF;
    letter-spacing: -0.01em;
    margin-bottom: 18px;
  }

  .hero-copy h1 em {
    font-style: normal;
    color: var(--mint);
  }

  .hero-copy p.lede {
    color: #B9CCC6;
    font-size: 15.5px;
    line-height: 1.6;
    max-width: 42ch;
    margin-bottom: 0;
  }

  .pill-row {
    display: flex;
    gap: 20px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #DCE9E4;
  }

  .pill .dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .pill .dot.a { background: var(--mint); color: var(--navy-deep); }
  .pill .dot.b { background: var(--gold); color: var(--navy-deep); }

  .cta-main {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    background: var(--mint);
    color: var(--navy-deep);
    border: none;
    padding: 15px 26px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
    white-space: nowrap;
  }

  .cta-main:hover { background: #A9E1D0; }
  .cta-main:active { transform: scale(0.97); }

  .cta-secondary {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    background: transparent;
    color: var(--navy-deep);
    border: 1px solid #DCE7E2;
    padding: 14px 24px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .cta-secondary:hover { background: rgba(0,0,0,0.03); }

  .hero-photo {
    position: relative;
    display: flex;
    justify-content: center;
  }

  .hero-photo img {
    width: 100%;
    max-width: 320px;
    aspect-ratio: 3/4;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }

  .hero-photo::before {
    content: '';
    position: absolute;
    inset: -14px 20px 20px -14px;
    border: 1px solid rgba(150, 215, 198, 0.35);
    border-radius: 24px;
    z-index: -1;
  }

  /* ── Stage grid ────────────────────────── */
  .stage-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 48px 4px 16px;
  }

  .stage-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }

  .tile {
    border-radius: 20px;
    padding: 26px 22px;
    min-height: 240px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .tile.mint { background: var(--mint-tile); }
  .tile.gold { background: var(--gold-tile); }
  .tile.coral { background: var(--coral-tile); }
  .tile.slate { background: var(--slate-tile); color: #1B2A40; }

    font-family: 'Fraun
